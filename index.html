<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F5EEDC;
            background-image: 
                radial-gradient(ellipse at 8% 15%, rgba(120, 85, 55, 0.22) 0%, transparent 45%),
                radial-gradient(ellipse at 92% 85%, rgba(120, 85, 55, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 8%, rgba(145, 110, 75, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 8% 92%, rgba(130, 95, 65, 0.24) 0%, transparent 40%),
                radial-gradient(ellipse at 92% 8%, rgba(140, 105, 70, 0.18) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 92%, rgba(125, 90, 60, 0.20) 0%, transparent 42%),
                radial-gradient(circle at 25% 40%, rgba(150, 115, 80, 0.14) 0%, transparent 28%),
                radial-gradient(circle at 75% 55%, rgba(135, 100, 68, 0.12) 0%, transparent 32%),
                radial-gradient(circle at 40% 75%, rgba(142, 108, 73, 0.13) 0%, transparent 25%),
                radial-gradient(circle at 60% 25%, rgba(128, 93, 63, 0.11) 0%, transparent 30%),
                linear-gradient(90deg, rgba(139, 109, 78, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(139, 109, 78, 0.03) 1px, transparent 1px);
            background-size: 
                100% 100%, 100% 100%, 100% 100%, 100% 100%,
                100% 100%, 100% 100%, 100% 100%, 100% 100%,
                100% 100%, 100% 100%, 70px 70px, 70px 70px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 📜 Recortes de periódico — Izquierda */
        .recorte-izq {
            position: fixed;
            left: 15px;
            top: 50%;
            transform: translateY(-50%) rotate(-7deg);
            width: 190px;
            height: 300px;
            background: linear-gradient(140deg, #F2E8D5 0%, #E5D8C5 100%);
            border: 1px solid rgba(139, 109, 78, 0.28);
            box-shadow: 5px 8px 15px rgba(80, 60, 40, 0.18);
            padding: 16px;
            font-size: 9px;
            line-height: 1.7;
            color: rgba(90, 70, 50, 0.35);
            z-index: 1;
        }

        /* 📜 Recortes de periódico — Derecha */
        .recorte-der {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) rotate(6deg);
            width: 190px;
            height: 300px;
            background: linear-gradient(40deg, #F2E8D5 0%, #E5D8C5 100%);
            border: 1px solid rgba(139, 109, 78, 0.28);
            box-shadow: -5px 8px 15px rgba(80, 60, 40, 0.18);
            padding: 16px;
            font-size: 9px;
            line-height: 1.7;
            color: rgba(90, 70, 50, 0.35);
            z-index: 1;
        }

        .linea {
            height: 3px;
            background: rgba(110, 85, 60, 0.16);
            margin-bottom: 6px;
            border-radius: 1px;
        }
        .linea:nth-child(odd) { width: 92%; }
        .linea:nth-child(even) { width: 85%; }

        /* 🔴 Sellos decorativos */
        .sello-1, .sello-2, .sello-3 {
            position: fixed;
            border: 3px solid rgba(115, 40, 40, 0.28);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: rgba(115, 40, 40, 0.38);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1;
        }
        .sello-1 { top: 50px; right: 50px; width: 95px; height: 95px; transform: rotate(-12deg); }
        .sello-2 { bottom: 60px; left: 50px; width: 80px; height: 80px; transform: rotate(18deg); border-color: rgba(80, 60, 40, 0.25); color: rgba(80, 60, 40, 0.35); }
        .sello-3 { top: 120px; left: 70px; width: 70px; height: 70px; transform: rotate(-25deg); border-color: rgba(40, 70, 90, 0.2); color: rgba(40, 70, 90, 0.28); font-size: 9px; }

        /* ✒️ Esquinas ornamentales */
        .esquina {
            position: fixed;
            width: 120px;
            height: 120px;
            border: 3px solid rgba(139, 109, 78, 0.15);
            z-index: 1;
        }
        .esquina-sup-izq { top: 25px; left: 25px; border-right: none; border-bottom: none; }
        .esquina-sup-der { top: 25px; right: 25px; border-left: none; border-bottom: none; }
        .esquina-inf-izq { bottom: 25px; left: 25px; border-right: none; border-top: none; }
        .esquina-inf-der { bottom: 25px; right: 25px; border-left: none; border-top: none; }

        /* ✨ Elementos decorativos flotantes */
        .adorno-1, .adorno-2, .adorno-3, .adorno-4 {
            position: fixed;
            color: rgba(139, 109, 78, 0.12);
            font-size: 28px;
            z-index: 1;
        }
        .adorno-1 { top: 80px; left: 160px; transform: rotate(-15deg); }
        .adorno-2 { top: 80px; right: 160px; transform: rotate(15deg); }
        .adorno-3 { bottom: 90px; left: 160px; transform: rotate(15deg); }
        .adorno-4 { bottom: 90px; right: 160px; transform: rotate(-15deg); }

        /* 🎬 Marco del video con mucho estilo */
        .marco-exterior {
            position: relative;
            z-index: 10;
            padding: 18px;
            background: linear-gradient(135deg, #E8DBC8 0%, #F9F4EA 50%, #E8DBC8 100%);
            border: 2px solid rgba(139, 109, 78, 0.25);
            box-shadow: 
                0 0 0 8px #F9F4EA,
                0 0 0 10px rgba(139, 109, 78, 0.15),
                0 12px 35px rgba(92, 69, 49, 0.25);
            border-radius: 6px;
        }

        .marco-interior {
            border: 1px solid rgba(139, 109, 78, 0.2);
            padding: 6px;
            background: #fff;
        }

        video, iframe {
            width: 100%;
            height: 460px;
            border: none;
            display: block;
        }

        /* 📱 Para celular: quitamos decoración para que se vea limpio */
        @media (max-width: 950px) {
            .recorte-izq, .recorte-der, .sello-1, .sello-2, .sello-3,
            .esquina, .adorno-1, .adorno-2, .adorno-3, .adorno-4 {
                display: none;
            }
            .marco-exterior { padding: 10px; }
        }

        @media (max-width: 600px) {
            video, iframe { height: 240px; }
        }
    </style>
</head>
<body>

    <!-- 📜 Recortes de periódico -->
    <div class="recorte-izq">
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
    </div>

    <div class="recorte-der">
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
        <div class="linea"></div><div class="linea"></div><div class="linea"></div>
    </div>

    <!-- 🔴 Sellos decorativos -->
    <div class="sello-1">Original<br>✦</div>
    <div class="sello-2">Archivo<br>❧</div>
    <div class="sello-3">✦</div>

    <!-- ✒️ Esquinas ornamentales -->
    <div class="esquina esquina-sup-izq"></div>
    <div class="esquina esquina-sup-der"></div>
    <div class="esquina esquina-inf-izq"></div>
    <div class="esquina esquina-inf-der"></div>

    <!-- ✨ Adornos flotantes -->
    <div class="adorno-1">❦</div>
    <div class="adorno-2">❦</div>
    <div class="adorno-3">❧</div>
    <div class="adorno-4">❧</div>

    <!-- 🎬 Video en el centro -->
    <div class="marco-exterior">
        <div class="marco-interior">
            <!-- ✅ PON TU VIDEO AQUÍ -->
            
            <!-- Opción A: Archivo de video -->
            <video src="identidad.mp4" controls autoplay></video>

            <!-- Opción B: YouTube -->
            <!-- <iframe src="ENLACE_DE_TU_VIDEO" allowfullscreen></iframe> -->
        </div>
    </div>

</body>
</html>
