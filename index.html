<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín de Santa Inés — Puebla</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #f4ebd8;
      --parchment-light: #faf5ea;
      --burgundy: #6b1d1d;
      --burgundy-dark: #4a1010;
      --gold: #a67c37;
      --gold-light: #d4af6a;
      --espresso: #2c1e16;
    }

    body {
      background-color: var(--parchment);
      color: var(--espresso);
      font-family: 'Lora', Georgia, serif;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(166, 124, 55, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(107, 29, 29, 0.07) 0%, transparent 50%);
    }

    h1, h2, h3, .font-cinzel {
      font-family: 'Cinzel', Georgia, serif;
    }

    .baroque-card {
      background-color: var(--parchment-light);
      border: 2px solid var(--gold);
      box-shadow: 0 8px 24px rgba(44, 30, 22, 0.08), inset 0 0 0 4px var(--parchment-light), inset 0 0 0 5px rgba(166, 124, 55, 0.4);
    }

    .burgundy-ribbon {
      background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
      color: #fdf6e7;
      border: 1.5px solid var(--gold-light);
      box-shadow: 0 4px 10px rgba(74, 16, 16, 0.25);
    }
  </style>
</head>
<body class="antialiased selection:bg-[#6b1d1d] selection:text-[#faf5ea]">

  <!-- Encabezado Principal -->
  <header class="py-12 px-4 text-center border-b-2 border-[#a67c37]/40">
    <div class="max-w-4xl mx-auto">
      <span class="text-xs uppercase tracking-[0.3em] text-[#a67c37] font-cinzel font-bold">Centro Histórico de Puebla</span>
      <h1 class="font-cinzel text-3xl sm:text-5xl font-bold text-[#6b1d1d] mt-2 mb-3">Jardín de Santa Inés</h1>
      <p class="text-base sm:text-lg text-[#5c4328] max-w-2xl mx-auto italic">
        Un rincón de historia virreinal ubicado en la 3 Sur y 9 Poniente.
      </p>
    </div>
  </header>

  <!-- Sección del Video -->
  <main class="py-12 px-4">
    <div class="max-w-4xl mx-auto">
      <div class="baroque-card p-4 sm:p-8 rounded-2xl">
        <div class="text-center mb-6">
          <span class="burgundy-ribbon px-4 py-1 rounded-full text-xs font-cinzel font-bold tracking-wider inline-block mb-2">Exposición Audiovisual</span>
          <h2 class="font-cinzel text-2xl sm:text-3xl font-bold text-[#6b1d1d]">Conoce el Recorrido</h2>
        </div>

        <!-- Contenedor del Video Adaptable (Responsive) -->
        <div class="relative w-full overflow-hidden rounded-xl border-2 border-[#6b1d1d] shadow-lg bg-black" style="padding-top: 56.25%;">
          <!-- 
            INSTRUCCIÓN: Reemplaza el enlace de abajo con el de tu video (por ejemplo, el enlace embed de YouTube o un archivo .mp4 local).
          -->
          <iframe 
            class="absolute top-0 left-0 w-full h-full"
            src="https://www.youtube.com/embed/TU_VIDEO_ID" 
            title="Video del Jardín de Santa Inés" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          ></iframe>
        </div>

        <div class="mt-6 text-center text-sm text-[#4a3728]">
          <p>Disfruta de este material sobre la arquitectura y el valor cultural de este emblemático jardín poblano.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="py-8 text-center border-t border-[#a67c37]/30 text-xs text-[#a67c37] font-cinzel tracking-widest">
    Patrimonio Histórico de Puebla
  </footer>

</body>
</html>
